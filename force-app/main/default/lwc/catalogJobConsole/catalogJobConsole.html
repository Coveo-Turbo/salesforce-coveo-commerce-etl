<template>
  <lightning-card title="Catalog Sync Run Center" icon-name="standard:product">
    <div class="cc-shell">
      <div class="cc-hero">
        <div>
          <p class="cc-kicker">Run Center</p>
          <h2 class="cc-heading">Launch and monitor catalog syncs</h2>
          <p class="cc-subtitle">
            Start product and Buyer Group access exports, then follow live batch
            progress without leaving Salesforce.
          </p>
        </div>
        <div class="cc-hero__actions">
          <lightning-button
            label="Refresh Status"
            variant="neutral"
            onclick={handleRefreshStatus}
            icon-name="utility:refresh"
            icon-position="right"
          ></lightning-button>
          <lightning-button
            label="Run All Products"
            variant="brand"
            onclick={handleRunAllProducts}
          ></lightning-button>
          <lightning-button
            label="Run All Access"
            variant="neutral"
            onclick={handleRunAllAvailability}
          ></lightning-button>
          <lightning-button
            label="Run All Syncs"
            variant="brand-outline"
            onclick={handleRunAllBoth}
          ></lightning-button>
        </div>
      </div>

      <template if:true={isLoading}>
        <div class="cc-loading">
          <lightning-spinner
            alternative-text="Loading catalog jobs"
          ></lightning-spinner>
        </div>
      </template>

      <template if:true={error}>
        <div class="cc-error">{errorMessage}</div>
      </template>

      <template if:true={hasConfigs}>
        <div class="cc-stat-grid">
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Total Jobs</p>
            <p class="cc-stat-card__value">{totalJobs}</p>
          </article>
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Active Jobs</p>
            <p class="cc-stat-card__value">{activeJobs}</p>
          </article>
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Full Sync Jobs</p>
            <p class="cc-stat-card__value">{fullSyncJobs}</p>
          </article>
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Delta Sync Jobs</p>
            <p class="cc-stat-card__value">{deltaSyncJobs}</p>
          </article>
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Access Ready</p>
            <p class="cc-stat-card__value">{availabilityReadyJobs}</p>
          </article>
          <article class="cc-stat-card">
            <p class="cc-stat-card__label">Live Runs</p>
            <p class="cc-stat-card__value">{liveRunsCount}</p>
          </article>
        </div>

        <div class="cc-layout">
          <section class="cc-panel">
            <div class="cc-panel__header">
              <div>
                <p class="cc-section-label">Catalog Jobs</p>
                <h3 class="cc-panel__title">Choose a sync configuration</h3>
                <p class="cc-panel__meta">
                  Compare configs in one place, then focus a row to launch from
                  the run workspace below.
                </p>
              </div>
            </div>

            <div class="cc-config-table-shell">
              <div class="cc-config-table-scroll">
                <table class="cc-config-table">
                  <thead>
                    <tr>
                      <th scope="col">Job</th>
                      <th scope="col">Sync</th>
                      <th scope="col">Experience</th>
                      <th scope="col">Product Scope</th>
                      <th scope="col">Buyer Group Access</th>
                      <th scope="col">Status</th>
                      <th scope="col">Last Sync</th>
                      <th scope="col">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={inventoryTableRows} for:item="config">
                      <tr key={config.id} class={config.inventoryRowClass}>
                        <td>
                          <button
                            type="button"
                            class="cc-config-table__job-button"
                            data-config-id={config.id}
                            onclick={handleSelectConfig}
                          >
                            <span class="cc-config-table__job-title">
                              {config.label}
                            </span>
                            <span class="cc-config-table__job-meta">
                              {config.developerName}
                            </span>
                          </button>
                          <div class="cc-config-table__badge-stack">
                            <span class={config.activeStatusClass}>
                              {config.activeStatusLabel}
                            </span>
                            <span class={config.productSyncStatusClass}>
                              {config.productSyncStatusLabel}
                            </span>
                            <span class={config.availabilityStatusClass}>
                              {config.availabilityStatusLabel}
                            </span>
                          </div>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventorySyncSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventorySyncMeta}
                          </p>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventoryExperienceSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventoryExperienceMeta}
                          </p>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventorySourceSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventorySourceMeta}
                          </p>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventoryAccessSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventoryAccessMeta}
                          </p>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventoryStatusSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventoryStatusMeta}
                          </p>
                        </td>
                        <td>
                          <p class="cc-config-table__primary">
                            {config.inventoryLastSyncSummary}
                          </p>
                          <p class="cc-config-table__secondary">
                            {config.inventoryLastSyncMeta}
                          </p>
                        </td>
                        <td>
                          <div class="cc-config-table__actions">
                            <button
                              type="button"
                              class="cc-table-action cc-table-action--primary"
                              data-config-id={config.id}
                              onclick={handleSelectConfig}
                            >
                              Focus
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="cc-panel cc-panel--workspace">
            <div class="cc-panel__header">
              <div>
                <p class="cc-section-label">Selected Config</p>
                <h3 class="cc-panel__title">{selectedRunHeading}</h3>
                <p class="cc-panel__meta">{selectedRunSubtitle}</p>
              </div>
              <template if:true={hasSelectedConfig}>
                <div class="cc-badge-group">
                  <span class={selectedConfigStatusClass}>
                    {selectedConfig.activeStatusLabel}
                  </span>
                  <span class={selectedConfigProductSyncClass}>
                    {selectedConfig.productSyncStatusLabel}
                  </span>
                  <span class={selectedConfigAvailabilityClass}>
                    {selectedConfig.availabilityStatusLabel}
                  </span>
                </div>
              </template>
            </div>

            <template if:true={hasSelectedConfig}>
              <div class="cc-launchpad">
                <div class="cc-launchpad__actions">
                  <lightning-button
                    label={selectedProductRunLabel}
                    variant="brand"
                    onclick={handleRunSelectedProducts}
                    disabled={selectedConfig.productDisabled}
                  ></lightning-button>
                  <lightning-button
                    label="Run Access"
                    variant="neutral"
                    onclick={handleRunSelectedAvailability}
                    disabled={selectedConfig.availabilityDisabled}
                  ></lightning-button>
                  <template if:true={showRunSelectedBoth}>
                    <lightning-button
                      label="Run Both"
                      variant="brand-outline"
                      onclick={handleRunSelectedBoth}
                      disabled={selectedConfig.bothDisabled}
                    ></lightning-button>
                  </template>
                  <lightning-button
                    label="Abort Product Run"
                    variant="destructive-text"
                    onclick={handleAbortSelectedProductRun}
                    disabled={abortSelectedProductRunDisabled}
                  ></lightning-button>
                </div>
                <div class="cc-launchpad__status">
                  <span class={selectedConfigQuickStatusClass}>
                    {selectedConfig.quickStatusLabel}
                  </span>
                  <div>
                    <p class="cc-launchpad__status-summary">
                      {selectedProductStatusSummary}
                    </p>
                    <p class="cc-launchpad__status-meta">
                      {selectedProductStatusMeta}
                    </p>
                  </div>
                </div>
                <template if:true={launchpadNote}>
                  <p class="cc-launchpad__note">{launchpadNote}</p>
                </template>
              </div>

              <div class="cc-detail-grid">
                <template for:each={selectedConfigFactRows} for:item="fact">
                  <article key={fact.label} class="cc-detail-card">
                    <p class="cc-detail-card__label">{fact.label}</p>
                    <p class="cc-detail-card__value">{fact.value}</p>
                  </article>
                </template>
              </div>
            </template>

            <div class="cc-monitor">
              <div class="cc-monitor__header">
                <div>
                  <p class="cc-section-label">Live Runs</p>
                  <h4 class="cc-monitor__title">Batch progress</h4>
                </div>
                <p class="cc-monitor__meta">{runMonitorSubtitle}</p>
              </div>

              <template if:true={hasRunSessions}>
                <div class="cc-run-list">
                  <template for:each={visibleRunSessions} for:item="run">
                    <article key={run.runKey} class={run.cardClass}>
                      <div class="cc-run-card__header">
                        <div>
                          <h5 class="cc-run-card__title">{run.label}</h5>
                          <p class="cc-run-card__meta">
                            {run.developerName} • Started {run.launchedAtLabel}
                          </p>
                          <p class="cc-run-card__timing">{run.timingLabel}</p>
                        </div>
                        <span class={run.overallStatusClass}>
                          {run.overallStatusLabel}
                        </span>
                      </div>

                      <lightning-progress-bar
                        value={run.progressPercent}
                        size="medium"
                      ></lightning-progress-bar>
                      <p class="cc-run-card__progress">
                        {run.progressPercent}% complete
                      </p>

                      <div class="cc-stage-list">
                        <template for:each={run.stages} for:item="stage">
                          <div key={stage.jobId} class="cc-stage-card">
                            <div class="cc-stage-card__header">
                              <div>
                                <p class="cc-stage-card__title">
                                  {stage.label}
                                </p>
                                <p class="cc-stage-card__meta">
                                  {stage.batchesLabel}
                                </p>
                                <template if:true={stage.timingLabel}>
                                  <p class="cc-stage-card__timing">
                                    {stage.timingLabel}
                                  </p>
                                </template>
                              </div>
                              <div class="cc-stage-card__actions">
                                <span class={stage.statusClass}>
                                  {stage.statusLabel}
                                </span>
                                <template if:true={stage.canAbort}>
                                  <button
                                    type="button"
                                    class="cc-stage-card__abort"
                                    data-job-id={stage.jobId}
                                    data-job-label={stage.label}
                                    onclick={handleAbortStage}
                                  >
                                    Abort
                                  </button>
                                </template>
                              </div>
                            </div>
                            <lightning-progress-bar
                              value={stage.progressPercent}
                              size="x-small"
                            ></lightning-progress-bar>
                            <template if:true={stage.extendedStatus}>
                              <p class="cc-stage-card__extended">
                                {stage.extendedStatus}
                              </p>
                            </template>
                          </div>
                        </template>
                      </div>
                    </article>
                  </template>
                </div>
              </template>
              <template if:false={hasRunSessions}>
                <div class="cc-empty-state">
                  Launch a sync from the selected configuration to populate the
                  run monitor.
                </div>
              </template>
            </div>

            <div class="cc-monitor cc-monitor--activity">
              <div class="cc-monitor__header">
                <div>
                  <p class="cc-section-label">Recent Activity</p>
                  <h4 class="cc-monitor__title">Console timeline</h4>
                </div>
                <p class="cc-monitor__meta">
                  Session-level activity from launches and status changes.
                </p>
              </div>

              <template if:true={hasActivityFeed}>
                <ul class="cc-activity-list">
                  <template for:each={visibleActivityFeed} for:item="entry">
                    <li key={entry.key} class="cc-activity-item">
                      <span class="cc-activity-item__time">
                        {entry.timestampLabel}
                      </span>
                      <span class="cc-activity-item__message">
                        {entry.message}
                      </span>
                    </li>
                  </template>
                </ul>
              </template>
              <template if:false={hasActivityFeed}>
                <div class="cc-empty-state">
                  Launch a run to start building the timeline.
                </div>
              </template>
            </div>
          </section>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
