<template>
  <lightning-card title="Coveo Catalog Jobs" icon-name="standard:product">
    <div class="cc-container slds-p-around_medium">
      <!-- Header row -->
      <div class="cc-header slds-grid slds-wrap slds-m-bottom_small">
        <div class="slds-col slds-size_1-of-2 slds-p-right_small">
          <p class="cc-subtitle">
            Manage and trigger catalog exports from Salesforce to Coveo.
          </p>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-text-align_right">
          <lightning-button
            label="Run All Products"
            variant="brand"
            onclick={handleRunAll}
            class="slds-m-left_x-small"
          >
          </lightning-button>
          <lightning-button
            label="Run All Availability"
            variant="neutral"
            onclick={handleRunAllAvailability}
            class="slds-m-left_x-small"
          >
          </lightning-button>
          <lightning-button
            label="Run All Both"
            variant="brand-outline"
            onclick={handleRunAllBoth}
            class="slds-m-left_x-small"
          >
          </lightning-button>
        </div>
      </div>

      <!-- Stats row -->
      <template if:true={configs}>
        <div class="cc-stats slds-grid slds-wrap slds-m-bottom_small">
          <div class="slds-col slds-size_1-of-3 slds-p-right_small">
            <div
              class="cc-stat-card slds-p-around_small slds-box slds-box_xx-small"
            >
              <div class="cc-stat-label">Total Jobs</div>
              <div class="cc-stat-value">{totalJobs}</div>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-3 slds-p-horizontal_small">
            <div
              class="cc-stat-card slds-p-around_small slds-box slds-box_xx-small"
            >
              <div class="cc-stat-label">Active Jobs</div>
              <div class="cc-stat-value cc-pill cc-pill--green">
                {activeJobs}
              </div>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-3 slds-p-left_small">
            <div
              class="cc-stat-card slds-p-around_small slds-box slds-box_xx-small"
            >
              <div class="cc-stat-label">Inactive Jobs</div>
              <div class="cc-stat-value cc-pill cc-pill--grey">
                {inactiveJobs}
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Table -->
      <template if:true={configs}>
        <lightning-datatable
          key-field="DeveloperName"
          data={configs}
          columns={columns}
          hide-checkbox-column
          onrowaction={handleRowAction}
          class="cc-table"
        >
        </lightning-datatable>
      </template>

      <!-- Errors -->
      <template if:true={error}>
        <p class="slds-text-color_error slds-m-top_small">{errorMessage}</p>
      </template>

      <!-- Loading -->
      <template if:true={isLoading}>
        <div class="slds-m-vertical_medium slds-text-align_center">
          <lightning-spinner
            alternative-text="Loading configurations"
          ></lightning-spinner>
        </div>
      </template>
    </div>

    <!-- Details Modal -->
    <template if:true={showDetailsModal}>
      <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open"
        aria-modal="true"
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <lightning-button-icon
              icon-name="utility:close"
              variant="bare-inverse"
              size="large"
              onclick={handleCloseModal}
              alternative-text="Close"
              class="slds-modal__close"
            ></lightning-button-icon>
            <h2 class="slds-text-heading_medium">{modalTitle}</h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <div class="slds-form">
              <div class="slds-form-element slds-m-bottom_medium">
                <label class="slds-form-element__label slds-text-title_bold">
                  Product Filter
                </label>
                <div class="slds-form-element__control">
                  <div class="cc-detail-content">{productFilter}</div>
                </div>
              </div>
              <div class="slds-form-element">
                <label class="slds-form-element__label slds-text-title_bold">
                  Additional Product Fields
                </label>
                <div class="slds-form-element__control">
                  <div class="cc-detail-content">{additionalFields}</div>
                </div>
              </div>
              <div class="slds-form-element slds-m-top_medium">
                <label class="slds-form-element__label slds-text-title_bold">
                  Availability Source Id
                </label>
                <div class="slds-form-element__control">
                  <div class="cc-detail-content">{availabilitySourceId}</div>
                </div>
              </div>
              <div class="slds-form-element slds-m-top_medium">
                <label class="slds-form-element__label slds-text-title_bold">
                  Web Store Id
                </label>
                <div class="slds-form-element__control">
                  <div class="cc-detail-content">{webStoreId}</div>
                </div>
              </div>
              <div class="slds-form-element slds-m-top_medium">
                <label class="slds-form-element__label slds-text-title_bold">
                  Buyer Group Availability
                </label>
                <div class="slds-form-element__control">
                  <div class="cc-detail-content">{availabilityEnabled}</div>
                </div>
              </div>
            </div>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button
              label="Close"
              onclick={handleCloseModal}
              variant="brand"
            ></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </lightning-card>
</template>
