<template>
  <div class="setup-shell">
    <section class="setup-hero slds-m-bottom_medium">
      <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
          <p class="setup-kicker">Commerce Setup Workspace</p>
          <h1 class="slds-text-heading_large setup-title">
            Coveo Commerce ETL Setup
          </h1>
          <p class="setup-subtitle">
            Configure your connection, draft catalog sync jobs with selectors
            instead of raw IDs, and move into the run console when you are ready
            to export.
          </p>
        </div>
        <div
          class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-text-align_right slds-m-top_small"
        >
          <lightning-button
            label="Open Catalog Job Console"
            variant="brand"
            onclick={handleOpenJobConsole}
            icon-name="utility:right"
            icon-position="right"
          ></lightning-button>
        </div>
      </div>
    </section>

    <div class="workspace-summary-grid">
      <template for:each={workspaceOverviewHighlights} for:item="highlight">
        <article key={highlight.key} class="workspace-summary-card">
          <p class="workspace-summary-card__label">{highlight.label}</p>
          <h2 class="workspace-summary-card__value">{highlight.value}</h2>
          <p class="workspace-summary-card__helper">{highlight.helper}</p>
          <lightning-button
            label={highlight.actionLabel}
            variant="neutral"
            data-workspace={highlight.target}
            onclick={handleWorkspaceSelect}
          ></lightning-button>
        </article>
      </template>
    </div>

    <div class="workspace-shell">
      <aside class="workspace-nav">
        <div class="workspace-nav__group">
          <p class="workspace-nav__label">Workspace</p>
          <button
            class={overviewNavClass}
            type="button"
            data-workspace="overview"
            onclick={handleWorkspaceSelect}
          >
            <span class="workspace-nav__title">Overview</span>
            <span class="workspace-nav__meta">Status and shortcuts</span>
          </button>
          <button
            class={connectionNavClass}
            type="button"
            data-workspace="connection"
            onclick={handleWorkspaceSelect}
          >
            <span class="workspace-nav__title">Connection</span>
            <span class="workspace-nav__meta">Named Credential and auth</span>
          </button>
          <button
            class={catalogJobsNavClass}
            type="button"
            data-workspace="catalogJobs"
            onclick={handleWorkspaceSelect}
          >
            <span class="workspace-nav__title">Catalog Jobs</span>
            <span class="workspace-nav__meta"
              >Inventory, editor, and preflight</span
            >
          </button>
          <button
            class={advancedNavClass}
            type="button"
            data-workspace="advanced"
            onclick={handleWorkspaceSelect}
          >
            <span class="workspace-nav__title">Advanced</span>
            <span class="workspace-nav__meta"
              >Builder mapping and validation</span
            >
          </button>
        </div>

        <div class="workspace-nav__group workspace-nav__group--support">
          <p class="workspace-nav__label">Quick Actions</p>
          <button
            class="workspace-action"
            type="button"
            onclick={handleOpenCustomMetadata}
          >
            <span class="workspace-action__title">Custom Metadata</span>
            <span class="workspace-action__meta">Manage config records</span>
          </button>
          <button
            class="workspace-action"
            type="button"
            onclick={handleOpenJobConsole}
          >
            <span class="workspace-action__title">Run Console</span>
            <span class="workspace-action__meta"
              >Launch product and Buyer Group access syncs</span
            >
          </button>
        </div>
      </aside>

      <section class="workspace-main">
        <template if:true={isOverviewView}>
          <div class="workspace-page-header">
            <div>
              <p class="section-label">Overview</p>
              <h2 class="workspace-page-title">Admin workspace summary</h2>
              <p class="workspace-page-subtitle">
                Start here when you want a quick read on connection health,
                catalog job coverage, and the next place to work.
              </p>
            </div>
          </div>

          <div class="overview-grid">
            <section class="workspace-card">
              <div class="workspace-card__header">
                <div>
                  <p class="section-label">Connection Snapshot</p>
                  <h3 class="slds-text-heading_small">
                    {workspaceConnectionStatusText}
                  </h3>
                </div>
                <lightning-badge
                  label={credentialStatusLabel}
                  class={credentialStatusClass}
                ></lightning-badge>
              </div>
              <p class="workspace-card__meta overview-copy">
                {workspaceConnectionSummary}
              </p>
              <div class="workspace-card__actions">
                <lightning-button
                  label="Open Connection"
                  variant="neutral"
                  data-workspace="connection"
                  onclick={handleWorkspaceSelect}
                ></lightning-button>
                <lightning-button
                  label="Test Connection"
                  variant="brand-outline"
                  onclick={handleTestConnection}
                  disabled={isTestingConnection}
                ></lightning-button>
              </div>
            </section>

            <section class="workspace-card">
              <div class="workspace-card__header">
                <div>
                  <p class="section-label">Catalog Job Coverage</p>
                  <h3 class="slds-text-heading_small">
                    {totalConfigs} configured jobs
                  </h3>
                </div>
                <div class="setup-stat-group">
                  <div class="setup-stat-pill setup-stat-pill--success">
                    <span class="setup-stat-pill__label">Active</span>
                    <span class="setup-stat-pill__value">{activeConfigs}</span>
                  </div>
                  <div class="setup-stat-pill">
                    <span class="setup-stat-pill__label">Buyer Group</span>
                    <span class="setup-stat-pill__value">
                      {availabilityEnabledConfigs}
                    </span>
                  </div>
                </div>
              </div>
              <p class="workspace-card__meta overview-copy">
                {workspaceCatalogSummary}
              </p>
              <div class="workspace-card__actions">
                <lightning-button
                  label="Open Catalog Jobs"
                  variant="brand"
                  data-workspace="catalogJobs"
                  onclick={handleWorkspaceSelect}
                ></lightning-button>
              </div>
            </section>

            <section class="workspace-card workspace-card--shade">
              <div class="workspace-card__header">
                <div>
                  <p class="section-label">Recommended Flow</p>
                  <h3 class="slds-text-heading_small">
                    Move through the workspace
                  </h3>
                </div>
              </div>
              <ol class="slds-list_ordered helper-list">
                <li>Verify the Coveo Push Named Credential.</li>
                <li>Draft or review your catalog job configurations.</li>
                <li>Use the run center to launch product or access syncs.</li>
                <li>Review advanced builder mappings only when needed.</li>
              </ol>
            </section>
          </div>
        </template>

        <template if:true={isConnectionView}>
          <div class="workspace-page-header">
            <div>
              <p class="section-label">Connection</p>
              <h2 class="workspace-page-title">Connect Salesforce to Coveo</h2>
              <p class="workspace-page-subtitle">
                Verify the Named Credential and external credential setup before
                anyone tries to run exports.
              </p>
            </div>
          </div>

          <div class="workspace-two-up">
            <section class="workspace-card">
              <div class="workspace-card__header">
                <div>
                  <h3 class="slds-text-heading_small">
                    Named Credential Status
                  </h3>
                  <p class="workspace-card__meta">
                    Verify that Salesforce can reach the Coveo Push API.
                  </p>
                </div>
              </div>

              <template if:true={isLoadingCredential}>
                <div class="section-spinner">
                  <lightning-spinner
                    alternative-text="Loading credential status"
                    size="small"
                  ></lightning-spinner>
                </div>
              </template>

              <template if:false={isLoadingCredential}>
                <div class="workspace-grid">
                  <div>
                    <p class="section-label">Status</p>
                    <lightning-badge
                      label={credentialStatusLabel}
                      class={credentialStatusClass}
                    ></lightning-badge>
                  </div>
                  <div>
                    <p class="section-label">Endpoint</p>
                    <p class="section-value" title={credentialEndpoint}>
                      {credentialEndpoint}
                    </p>
                  </div>
                </div>
              </template>

              <div class="workspace-card__actions">
                <lightning-button
                  label="Test Connection"
                  variant="neutral"
                  onclick={handleTestConnection}
                  disabled={isTestingConnection}
                ></lightning-button>
                <lightning-button
                  label="Open Named Credentials Setup"
                  variant="brand-outline"
                  onclick={handleOpenNamedCredentials}
                  icon-name="utility:new_window"
                  icon-position="right"
                ></lightning-button>
              </div>

              <template if:true={connectionTestResult}>
                <div class={connectionTestClass}>
                  <lightning-icon
                    icon-name={connectionTestIcon}
                    size="x-small"
                    class="slds-m-right_x-small"
                  ></lightning-icon>
                  {connectionTestMessage}
                </div>
              </template>
            </section>

            <section class="workspace-card workspace-card--shade">
              <div class="workspace-card__header">
                <div>
                  <h3 class="slds-text-heading_small">Setup Checklist</h3>
                  <p class="workspace-card__meta">
                    These are the minimum pieces needed before a sync can run.
                  </p>
                </div>
              </div>

              <ol class="slds-list_ordered helper-list">
                <li>Open <strong>Setup → Named Credentials</strong>.</li>
                <li>
                  Create or update the <code>Coveo_Push</code> Named Credential.
                </li>
                <li>Set the endpoint to your Coveo Push API base URL.</li>
                <li>
                  Open <strong>External Credentials</strong> and update
                  <code>CoveoPushAuthCred</code>.
                </li>
                <li>
                  Add the <code>API_KEY</code> authentication parameter with
                  your Coveo API key.
                </li>
                <li>
                  Assign the <code>CoveoETL_Admin</code> permission set to the
                  admin who will run exports.
                </li>
              </ol>
            </section>
          </div>
        </template>

        <template if:true={isCatalogJobsView}>
          <div class="workspace-page-header">
            <div>
              <p class="section-label">Catalog Jobs</p>
              <h2 class="workspace-page-title">
                Manage catalog job configurations
              </h2>
              <p class="workspace-page-subtitle">
                Work from a proper inventory, edit a draft in-place, and keep a
                live preflight review visible while you build or reuse configs.
              </p>
            </div>
            <div class="workspace-page-actions">
              <lightning-button
                label="Refresh Job Status"
                variant="neutral"
                onclick={handleRefreshCatalogJobs}
                icon-name="utility:refresh"
                icon-position="right"
              ></lightning-button>
              <lightning-button
                label="Open Custom Metadata Setup"
                variant="brand-outline"
                onclick={handleOpenCustomMetadata}
                icon-name="utility:new_window"
                icon-position="right"
              ></lightning-button>
            </div>
          </div>

          <div class="workspace-banner slds-m-bottom_medium">
            <lightning-icon
              icon-name="utility:info"
              size="x-small"
              class="slds-m-right_x-small"
            ></lightning-icon>
            This assistant prepares the exact values for a
            <code>CatalogJobConfig__mdt</code> record. Saving still happens in
            Custom Metadata Setup for this UX phase.
          </div>

          <template if:true={isLoadingWorkspaceOptions}>
            <div class="section-spinner">
              <lightning-spinner
                alternative-text="Loading workspace options"
              ></lightning-spinner>
            </div>
          </template>

          <template if:true={hasWorkspaceOptions}>
            <div class="jobs-workspace">
              <aside class="workspace-card jobs-inventory">
                <div class="workspace-card__header">
                  <div>
                    <p class="section-label">Current Catalog Jobs</p>
                    <h3 class="slds-text-heading_small">
                      Scan and compare configured sync jobs
                    </h3>
                    <p class="workspace-card__meta">
                      A table view keeps larger job inventories readable and
                      makes it easier to compare sync type, cadence, scope, and
                      last sync activity at a glance.
                    </p>
                  </div>
                  <div class="setup-stat-group">
                    <div class="setup-stat-pill">
                      <span class="setup-stat-pill__label">Total</span>
                      <span class="setup-stat-pill__value">{totalConfigs}</span>
                    </div>
                    <div class="setup-stat-pill setup-stat-pill--success">
                      <span class="setup-stat-pill__label">Active</span>
                      <span class="setup-stat-pill__value"
                        >{activeConfigs}</span
                      >
                    </div>
                    <div class="setup-stat-pill">
                      <span class="setup-stat-pill__label">Full</span>
                      <span class="setup-stat-pill__value">
                        {fullSyncConfigs}
                      </span>
                    </div>
                    <div class="setup-stat-pill">
                      <span class="setup-stat-pill__label">Delta</span>
                      <span class="setup-stat-pill__value">
                        {deltaSyncConfigs}
                      </span>
                    </div>
                    <div class="setup-stat-pill">
                      <span class="setup-stat-pill__label">Scheduled</span>
                      <span class="setup-stat-pill__value">
                        {scheduledConfigs}
                      </span>
                    </div>
                  </div>
                </div>

                <template if:true={isLoadingConfigs}>
                  <div class="section-spinner">
                    <lightning-spinner
                      alternative-text="Loading catalog job configurations"
                    ></lightning-spinner>
                  </div>
                </template>

                <template if:true={hasConfigs}>
                  <div class="config-table-shell">
                    <div class="config-table-scroll">
                      <table class="config-table">
                        <thead>
                          <tr>
                            <th scope="col">Job</th>
                            <th scope="col">Sync</th>
                            <th scope="col">Schedule</th>
                            <th scope="col">Experience</th>
                            <th scope="col">Product Source</th>
                            <th scope="col">Buyer Group Access</th>
                            <th scope="col">Latest Sync</th>
                            <th scope="col">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template
                            for:each={inventoryTableRows}
                            for:item="config"
                          >
                            <tr
                              key={config.id}
                              class={config.inventoryRowClass}
                            >
                              <td>
                                <button
                                  type="button"
                                  class="config-table__job-button"
                                  data-config-id={config.id}
                                  onclick={handleSelectConfig}
                                >
                                  <span class="config-table__job-title">
                                    {config.label}
                                  </span>
                                  <span class="config-table__job-meta">
                                    {config.developerName}
                                  </span>
                                </button>
                                <div class="config-table__badge-stack">
                                  <span class={config.activeStatusClass}>
                                    {config.activeStatusLabel}
                                  </span>
                                  <span class={config.syncStatusClass}>
                                    {config.syncStatusLabel}
                                  </span>
                                  <span class={config.scheduleStatusClass}>
                                    {config.scheduleStatusLabel}
                                  </span>
                                </div>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventoryRunSummary}
                                </p>
                                <p class="config-table__secondary">
                                  {config.inventoryRunMeta}
                                </p>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventoryScheduleSummary}
                                </p>
                                <p class="config-table__secondary">
                                  {config.inventoryScheduleMeta}
                                </p>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventoryExperienceSummary}
                                </p>
                                <p class="config-table__secondary">
                                  {config.inventoryExperienceMeta}
                                </p>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventorySourceSummary}
                                </p>
                                <p class="config-table__secondary">
                                  Org: {config.inventorySourceMeta}
                                </p>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventoryAccessSummary}
                                </p>
                                <p class="config-table__secondary">
                                  {config.inventoryAccessMeta}
                                </p>
                              </td>
                              <td>
                                <p class="config-table__primary">
                                  {config.inventoryLastSyncSummary}
                                </p>
                                <p class="config-table__secondary">
                                  {config.inventoryLastSyncMeta}
                                </p>
                              </td>
                              <td>
                                <div class="config-table__actions">
                                  <button
                                    type="button"
                                    class="table-action table-action--primary"
                                    data-config-id={config.id}
                                    onclick={handleSelectConfig}
                                  >
                                    Inspect
                                  </button>
                                  <button
                                    type="button"
                                    class="table-action"
                                    data-config-id={config.id}
                                    onclick={handleLoadDraftClick}
                                  >
                                    Use as Draft
                                  </button>
                                </div>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>

                <template if:true={noConfigs}>
                  <div class="empty-state">
                    <lightning-icon
                      icon-name="utility:add"
                      size="small"
                      class="slds-m-bottom_small"
                    ></lightning-icon>
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                      No Catalog Jobs Configured Yet
                    </h3>
                    <p class="slds-text-body_regular slds-text-color_weak">
                      Use the draft builder and then open Custom Metadata Setup
                      to create your first record.
                    </p>
                  </div>
                </template>
              </aside>

              <section class="workspace-card jobs-editor">
                <div class="workspace-card__header">
                  <div>
                    <p class="section-label">Guided Job Draft</p>
                    <h3 class="slds-text-heading_medium">
                      Build or revise a config in-place
                    </h3>
                    <p class="workspace-card__meta">
                      Draft settings here, then use the summary on the right to
                      verify the final metadata shape before saving.
                    </p>
                  </div>
                  <lightning-badge
                    label={availabilityToggleLabel}
                    class="workspace-badge"
                  ></lightning-badge>
                </div>

                <section class="editor-section">
                  <div class="editor-section__header">
                    <p class="section-label">Basics</p>
                    <p class="editor-section__meta">
                      Core identity, destination, and builder selection.
                    </p>
                  </div>
                  <div class="workspace-grid">
                    <lightning-input
                      label="Job Label"
                      value={draft.label}
                      data-field="label"
                      onchange={handleDraftInputChange}
                      placeholder="US B2B Store"
                      required
                    ></lightning-input>

                    <lightning-input
                      label="Developer Name"
                      value={draft.developerName}
                      data-field="developerName"
                      onchange={handleDraftInputChange}
                      placeholder="US_B2B_STORE"
                      field-level-help="Custom Metadata developer names use letters, numbers, and underscores."
                    ></lightning-input>

                    <lightning-input
                      label="Coveo Org Id"
                      value={draft.coveoOrgId}
                      data-field="coveoOrgId"
                      onchange={handleDraftInputChange}
                      placeholder="mycoveoorgabc123"
                      required
                    ></lightning-input>

                    <lightning-input
                      label="Product Source Id"
                      value={draft.sourceId}
                      data-field="sourceId"
                      onchange={handleDraftInputChange}
                      placeholder="catalog-products-us"
                      required
                    ></lightning-input>

                    <lightning-combobox
                      label="Sync Type"
                      value={draft.syncMode}
                      data-field="syncMode"
                      options={syncModeOptions}
                      onchange={handleDraftInputChange}
                      field-level-help="Full sync seeds the trusted baseline. Delta sync exports only changed root products and requires a baseline full config."
                    ></lightning-combobox>

                    <template if:true={isDeltaDraft}>
                      <lightning-input
                        label="Baseline Full Config Developer Name"
                        value={draft.baselineFullConfigDeveloperName}
                        data-field="baselineFullConfigDeveloperName"
                        onchange={handleDraftInputChange}
                        placeholder="WEEKLY_FULL_SYNC"
                        field-level-help="Required for Delta syncs. Use the Developer Name of the Full catalog job that establishes the export baseline."
                      ></lightning-input>
                    </template>

                    <lightning-combobox
                      label="Locale"
                      value={draft.locale}
                      data-field="locale"
                      options={localeOptions}
                      onchange={handleDraftInputChange}
                    ></lightning-combobox>

                    <lightning-combobox
                      label="Builder Type"
                      value={draft.builderType}
                      data-field="builderType"
                      options={builderTypeOptions}
                      onchange={handleDraftInputChange}
                      field-level-help="Built-in builders appear here, and any custom builders mapped in CatalogJsonBuilderMapping__mdt are included too."
                    ></lightning-combobox>
                  </div>
                </section>

                <section class="editor-section">
                  <div class="editor-section__header">
                    <p class="section-label">Product Scope</p>
                    <p class="editor-section__meta">
                      Choose the catalog and any optional field or filter
                      overrides.
                    </p>
                  </div>
                  <div class="workspace-grid">
                    <lightning-combobox
                      label="Product Catalog"
                      value={draft.catalogId}
                      data-field="catalogId"
                      options={catalogOptions}
                      onchange={handleDraftInputChange}
                      placeholder="Select a catalog"
                    ></lightning-combobox>
                  </div>

                  <div class="slds-m-top_medium">
                    <lightning-textarea
                      label="Product Filter"
                      value={draft.productFilter}
                      data-field="productFilter"
                      onchange={handleDraftInputChange}
                      placeholder="Family = 'Generators'"
                      field-level-help="Provide a SOQL WHERE clause fragment to narrow the product scope."
                    ></lightning-textarea>
                  </div>

                  <div class="slds-m-top_medium">
                    <lightning-dual-listbox
                      name="additionalFields"
                      label="Additional Product Fields"
                      source-label="Available Product2 fields"
                      selected-label="Fields to export"
                      options={productFieldOptions}
                      value={draft.additionalProductFields}
                      onchange={handleAdditionalFieldsChange}
                    ></lightning-dual-listbox>
                  </div>
                </section>

                <section class="editor-section">
                  <div class="editor-section__header">
                    <p class="section-label">Buyer Group Access</p>
                    <p class="editor-section__meta">
                      Choose whether Buyer Group access stays in a paired
                      availability source or is embedded directly on product
                      documents.
                    </p>
                  </div>
                  <div class="workspace-grid">
                    <lightning-combobox
                      label="Buyer Group Availability Mode"
                      value={draft.buyerGroupAvailabilityMode}
                      data-field="buyerGroupAvailabilityMode"
                      options={buyerGroupAvailabilityModeOptions}
                      onchange={handleDraftInputChange}
                    ></lightning-combobox>

                    <lightning-combobox
                      label="Web Store"
                      value={draft.webStoreId}
                      data-field="webStoreId"
                      options={webStoreOptions}
                      onchange={handleDraftInputChange}
                      placeholder="Select a store"
                      disabled={areAvailabilityFieldsDisabled}
                    ></lightning-combobox>

                    <lightning-input
                      label="Availability Source Id"
                      value={draft.availabilitySourceId}
                      data-field="availabilitySourceId"
                      onchange={handleDraftInputChange}
                      placeholder="catalog-availability-us"
                      disabled={isAvailabilitySourceDisabled}
                    ></lightning-input>
                  </div>
                </section>

                <div class="workspace-card__actions">
                  <lightning-button
                    label="Reset Draft"
                    onclick={handleResetDraft}
                    disabled={isResetDraftDisabled}
                  ></lightning-button>
                  <lightning-button
                    label="Copy Draft Summary"
                    variant="brand"
                    onclick={handleCopyDraft}
                    disabled={isCopyDraftDisabled}
                  ></lightning-button>
                  <lightning-button
                    label="Open Custom Metadata Setup"
                    variant="brand-outline"
                    onclick={handleOpenCustomMetadata}
                    icon-name="utility:new_window"
                    icon-position="right"
                  ></lightning-button>
                </div>
              </section>

              <aside class="workspace-card workspace-card--sticky jobs-review">
                <div class="workspace-card__header">
                  <div>
                    <p class="section-label">Review & Preflight</p>
                    <h3 class="slds-text-heading_medium">
                      Check readiness before save
                    </h3>
                  </div>
                  <span class={draftStatusClass}>{draftStatusLabel}</span>
                </div>

                <template if:true={isLoadingDraftPreview}>
                  <div class="section-spinner">
                    <lightning-spinner
                      alternative-text="Refreshing draft preview"
                      size="small"
                    ></lightning-spinner>
                  </div>
                </template>

                <template if:false={hasDraftInput}>
                  <div class="empty-review-state">
                    <p class="slds-text-body_regular">
                      Start with a label, source id, and catalog selection to
                      build a config draft.
                    </p>
                  </div>
                </template>

                <template if:true={hasDraftInput}>
                  <div class="review-stat-grid">
                    <div class="review-stat-card">
                      <p class="review-stat-card__label">Estimated Products</p>
                      <p class="review-stat-card__value">
                        {draftEstimatedProductCount}
                      </p>
                    </div>
                    <div class="review-stat-card">
                      <p class="review-stat-card__label">Buyer Groups</p>
                      <p class="review-stat-card__value">
                        {draftBuyerGroupCount}
                      </p>
                    </div>
                    <div class="review-stat-card">
                      <p class="review-stat-card__label">Extra Fields</p>
                      <p class="review-stat-card__value">
                        {draftSelectedFieldCount}
                      </p>
                    </div>
                  </div>

                  <div class="review-summary slds-m-top_medium">
                    <div class="review-summary__row">
                      <span class="review-summary__label">Catalog</span>
                      <span class="review-summary__value">
                        {draftSummaryCatalogText}
                      </span>
                    </div>
                    <div class="review-summary__row">
                      <span class="review-summary__label">Sync Type</span>
                      <span class="review-summary__value">
                        {selectedSyncModeLabel}
                      </span>
                    </div>
                    <div class="review-summary__row">
                      <span class="review-summary__label">Baseline</span>
                      <span class="review-summary__value">
                        {draftSummaryBaselineText}
                      </span>
                    </div>
                    <div class="review-summary__row">
                      <span class="review-summary__label">Access Mode</span>
                      <span class="review-summary__value">
                        {selectedBuyerGroupModeLabel}
                      </span>
                    </div>
                    <div class="review-summary__row">
                      <span class="review-summary__label">Web Store</span>
                      <span class="review-summary__value">
                        {draftSummaryWebStoreText}
                      </span>
                    </div>
                    <div class="review-summary__row">
                      <span class="review-summary__label">Builder</span>
                      <span class="review-summary__value">
                        {selectedBuilderTypeLabel}
                      </span>
                    </div>
                  </div>

                  <template if:true={hasDraftValidationMessages}>
                    <div
                      class="message-panel message-panel--error slds-m-top_medium"
                    >
                      <p class="message-panel__title">Required before save</p>
                      <ul class="message-list">
                        <template
                          for:each={draftPreviewValidationMessages}
                          for:item="message"
                        >
                          <li key={message}>{message}</li>
                        </template>
                      </ul>
                    </div>
                  </template>

                  <template if:true={hasDraftWarningMessages}>
                    <div
                      class="message-panel message-panel--warning slds-m-top_medium"
                    >
                      <p class="message-panel__title">Helpful notes</p>
                      <ul class="message-list">
                        <template
                          for:each={draftPreviewWarningMessages}
                          for:item="message"
                        >
                          <li key={message}>{message}</li>
                        </template>
                      </ul>
                    </div>
                  </template>

                  <div class="code-preview slds-m-top_medium">
                    <p class="section-label slds-m-bottom_x-small">
                      Draft Summary
                    </p>
                    <pre>{generatedConfigDraft}</pre>
                  </div>
                </template>
              </aside>
            </div>

            <template if:true={hasSelectedConfig}>
              <section class="workspace-card jobs-detail-panel">
                <div class="workspace-card__header">
                  <div>
                    <p class="section-label">Selected Config</p>
                    <h3 class="slds-text-heading_medium">
                      {selectedConfigTitle}
                    </h3>
                    <p class="workspace-card__meta">{selectedConfigSubtitle}</p>
                  </div>
                  <div class="config-modal-badges">
                    <lightning-badge
                      label={configStatusBadgeLabel}
                      class={configStatusBadgeClass}
                    ></lightning-badge>
                    <lightning-badge
                      label={configAvailabilityBadgeLabel}
                      class={configAvailabilityBadgeClass}
                    ></lightning-badge>
                  </div>
                </div>

                <div class="config-detail-panel__actions">
                  <lightning-button
                    label="Load into Draft"
                    variant="brand"
                    onclick={handleLoadDraftClick}
                    data-config-id={selectedConfigId}
                  ></lightning-button>
                </div>

                <div class="selected-config-overview-grid">
                  <template
                    for:each={selectedConfigOverviewFields}
                    for:item="field"
                  >
                    <article
                      key={field.key}
                      class="selected-config-overview-card"
                    >
                      <p class="selected-config-overview-card__label">
                        {field.label}
                      </p>
                      <p class="selected-config-overview-card__value">
                        {field.value}
                      </p>
                      <p class="selected-config-overview-card__helper">
                        {field.helper}
                      </p>
                    </article>
                  </template>
                </div>

                <lightning-accordion
                  allow-multiple-sections-open
                  active-section-name={detailAccordionOpenSections}
                  onsectiontoggle={handleDetailSectionToggle}
                  class="config-detail-accordion"
                >
                  <lightning-accordion-section name="summary" label="Summary">
                    <section class="detail-section">
                      <p class="detail-section__meta">
                        Core identity, org target, and resolved builder
                        selection.
                      </p>
                      <div class="detail-grid">
                        <template
                          for:each={configSummaryFields}
                          for:item="field"
                        >
                          <div key={field.label} class="detail-field">
                            <p class="detail-field__label">{field.label}</p>
                            <p class="detail-field__value">{field.value}</p>
                          </div>
                        </template>
                      </div>
                    </section>
                  </lightning-accordion-section>

                  <lightning-accordion-section
                    name="scheduling"
                    label="Scheduling"
                  >
                    <section class="detail-section">
                      <p class="detail-section__meta">
                        Create or replace the native Salesforce scheduled job
                        for this sync config without using Apex manually.
                      </p>

                      <div class="detail-grid">
                        <div class="detail-field">
                          <p class="detail-field__label">Sync Type</p>
                          <p class="detail-field__value">
                            {selectedConfigRow.syncMode}
                          </p>
                        </div>
                        <div class="detail-field">
                          <p class="detail-field__label">Current Cadence</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduleCadence}
                          </p>
                        </div>
                        <div class="detail-field">
                          <p class="detail-field__label">Schedule State</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduleState}
                          </p>
                        </div>
                        <div class="detail-field">
                          <p class="detail-field__label">Next Run</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduleNextRun}
                          </p>
                        </div>
                        <div class="detail-field">
                          <p class="detail-field__label">Last Run</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduleLastRun}
                          </p>
                        </div>
                        <div class="detail-field">
                          <p class="detail-field__label">Native Job</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduledJobName}
                          </p>
                        </div>
                        <div class="detail-field detail-field--full">
                          <p class="detail-field__label">Cron Expression</p>
                          <p class="detail-field__value">
                            {selectedConfigScheduleCronExpression}
                          </p>
                        </div>
                      </div>

                      <template if:true={showDeltaScheduleNotice}>
                        <div class="info-banner slds-m-top_medium">
                          <lightning-icon
                            icon-name="utility:warning"
                            size="x-small"
                          ></lightning-icon>
                          Delta schedules can be created now, but the job will
                          stay blocked until the baseline full sync succeeds
                          once.
                        </div>
                      </template>

                      <template if:true={showCustomScheduleNotice}>
                        <div class="info-banner slds-m-top_medium">
                          <lightning-icon
                            icon-name="utility:info"
                            size="x-small"
                          ></lightning-icon>
                          This job currently uses a custom cron expression.
                          Saving from this panel will replace it with the
                          cadence below.
                        </div>
                      </template>

                      <div class="schedule-form-grid slds-m-top_medium">
                        <lightning-combobox
                          label="Cadence"
                          value={selectedScheduleCadenceType}
                          options={scheduleCadenceOptions}
                          data-field="cadenceType"
                          onchange={handleScheduleDraftChange}
                        ></lightning-combobox>

                        <template if:true={isScheduleDraftMinutes}>
                          <lightning-input
                            type="number"
                            label="Every N Minutes"
                            min="1"
                            max="59"
                            step="1"
                            value={scheduleIntervalMinutesValue}
                            data-field="intervalMinutes"
                            onchange={handleScheduleDraftChange}
                          ></lightning-input>
                        </template>

                        <template if:true={isScheduleDraftHourly}>
                          <lightning-input
                            type="number"
                            label="Every N Hours"
                            min="1"
                            max="24"
                            step="1"
                            value={scheduleIntervalHoursValue}
                            data-field="intervalHours"
                            onchange={handleScheduleDraftChange}
                          ></lightning-input>
                        </template>

                        <template if:true={isScheduleDraftWeekly}>
                          <lightning-combobox
                            label="Day of Week"
                            value={scheduleDayOfWeekValue}
                            options={scheduleDayOptions}
                            data-field="dayOfWeek"
                            onchange={handleScheduleDraftChange}
                          ></lightning-combobox>
                          <lightning-input
                            type="number"
                            label="Hour (0-23)"
                            min="0"
                            max="23"
                            step="1"
                            value={scheduleHourOfDayValue}
                            data-field="hourOfDay"
                            onchange={handleScheduleDraftChange}
                          ></lightning-input>
                        </template>

                        <lightning-input
                          type="number"
                          label={scheduleMinuteLabel}
                          min="0"
                          max="59"
                          step="1"
                          value={scheduleMinuteOfHourValue}
                          data-field="minuteOfHour"
                          onchange={handleScheduleDraftChange}
                        ></lightning-input>
                      </div>

                      <div class="workspace-card__actions">
                        <lightning-button
                          label="Reset"
                          onclick={handleResetScheduleDraft}
                          disabled={isScheduleResetDisabled}
                        ></lightning-button>
                        <lightning-button
                          label="Remove Schedule"
                          onclick={handleClearSchedule}
                          disabled={isScheduleClearDisabled}
                        ></lightning-button>
                        <lightning-button
                          label={scheduleSaveButtonLabel}
                          variant="brand"
                          onclick={handleSaveSchedule}
                          disabled={isScheduleSaveDisabled}
                        ></lightning-button>
                      </div>

                      <template if:true={hasRelatedScheduleConfigs}>
                        <div class="slds-m-top_medium">
                          <p class="detail-field__label slds-m-bottom_x-small">
                            Related Sync Jobs
                          </p>
                          <div class="schedule-related-grid">
                            <template
                              for:each={relatedScheduleConfigs}
                              for:item="config"
                            >
                              <button
                                key={config.id}
                                type="button"
                                class="schedule-related-card"
                                data-config-id={config.id}
                                onclick={handleSelectConfig}
                              >
                                <span class="schedule-related-card__title">
                                  {config.title}
                                </span>
                                <span class="schedule-related-card__meta">
                                  {config.meta}
                                </span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </section>
                  </lightning-accordion-section>

                  <lightning-accordion-section
                    name="scope"
                    label="Product Scope"
                  >
                    <section class="detail-section">
                      <p class="detail-section__meta">
                        Catalog targeting, source destination, and filter
                        coverage.
                      </p>
                      <div class="detail-grid">
                        <template
                          for:each={configProductScopeFields}
                          for:item="field"
                        >
                          <div key={field.label} class="detail-field">
                            <p class="detail-field__label">{field.label}</p>
                            <p class="detail-field__value">{field.value}</p>
                          </div>
                        </template>
                      </div>

                      <div class="slds-m-top_medium">
                        <p class="detail-field__label slds-m-bottom_x-small">
                          Additional Product Fields
                        </p>
                        <template if:true={hasConfigAdditionalFieldPills}>
                          <div class="detail-pill-list">
                            <template
                              for:each={configAdditionalFieldPills}
                              for:item="field"
                            >
                              <span key={field.key} class="detail-pill">
                                {field.label}
                              </span>
                            </template>
                          </div>
                        </template>
                        <template if:false={hasConfigAdditionalFieldPills}>
                          <p class="detail-empty-value">
                            No additional fields selected.
                          </p>
                        </template>
                      </div>
                    </section>
                  </lightning-accordion-section>

                  <lightning-accordion-section
                    name="buyerGroup"
                    label="Buyer Group Access"
                  >
                    <section class="detail-section">
                      <p class="detail-section__meta">
                        Buyer Group mode, store targeting, and access
                        destination details.
                      </p>
                      <div class="detail-grid">
                        <template
                          for:each={configAvailabilityFields}
                          for:item="field"
                        >
                          <div key={field.label} class="detail-field">
                            <p class="detail-field__label">{field.label}</p>
                            <p class="detail-field__value">{field.value}</p>
                          </div>
                        </template>
                      </div>
                    </section>
                  </lightning-accordion-section>

                  <lightning-accordion-section name="advanced" label="Advanced">
                    <section class="detail-section">
                      <p class="detail-section__meta">
                        Raw ids and advanced values that are still useful during
                        troubleshooting.
                      </p>
                      <div class="detail-grid">
                        <template
                          for:each={configAdvancedFields}
                          for:item="field"
                        >
                          <div key={field.label} class="detail-field">
                            <p class="detail-field__label">{field.label}</p>
                            <p class="detail-field__value">{field.value}</p>
                          </div>
                        </template>
                      </div>
                    </section>
                  </lightning-accordion-section>

                  <lightning-accordion-section
                    name="metadata"
                    label="Raw Metadata Snapshot"
                  >
                    <section class="detail-section detail-section--full">
                      <p class="detail-section__meta">
                        Exact field values for quick copy/paste into Custom
                        Metadata Setup.
                      </p>
                      <div class="code-preview">
                        <pre>{configMetadataSummary}</pre>
                      </div>
                    </section>
                  </lightning-accordion-section>
                </lightning-accordion>
              </section>
            </template>
          </template>
        </template>

        <template if:true={isAdvancedView}>
          <div class="workspace-page-header">
            <div>
              <p class="section-label">Advanced</p>
              <h2 class="workspace-page-title">
                Builder mapping and validation
              </h2>
              <p class="workspace-page-subtitle">
                Review the global default builder, validate custom builder
                classes, and inspect the available per-catalog override choices.
              </p>
            </div>
          </div>

          <div class="info-banner slds-m-bottom_medium">
            <lightning-icon
              icon-name="utility:info"
              size="x-small"
              class="slds-m-right_x-small"
            ></lightning-icon>
            Each catalog job can override the global builder by setting
            <code>BuilderType__c</code> on the config record.
          </div>

          <div class="workspace-two-up">
            <section class="workspace-card">
              <div class="workspace-card__header">
                <div>
                  <p class="section-label">Global Default Builder</p>
                  <h3 class="slds-text-heading_small">{builderClassName}</h3>
                </div>
                <lightning-badge
                  label={builderBadgeLabel}
                  class={builderBadgeClass}
                ></lightning-badge>
              </div>

              <template if:true={isLoadingBuilder}>
                <div class="section-spinner">
                  <lightning-spinner
                    alternative-text="Loading builder mapping"
                    size="small"
                  ></lightning-spinner>
                </div>
              </template>

              <template if:false={isLoadingBuilder}>
                <p class="slds-text-body_small slds-text-color_weak">
                  This builder is used whenever a catalog job does not specify a
                  Builder Type value.
                </p>
              </template>

              <div class="slds-m-top_medium">
                <lightning-input
                  type="text"
                  label="Validate Custom Builder Class"
                  placeholder="Enter Apex class name"
                  value={customBuilderInput}
                  onchange={handleCustomBuilderInputChange}
                  field-level-help="Test if a custom builder class is valid before deploying it."
                ></lightning-input>

                <div class="workspace-card__actions">
                  <lightning-button
                    label="Validate Class"
                    variant="neutral"
                    onclick={handleValidateBuilder}
                    disabled={isValidatingBuilder}
                  ></lightning-button>
                </div>

                <template if:true={builderValidationResult}>
                  <div class={builderValidationClass}>
                    <lightning-icon
                      icon-name={builderValidationIcon}
                      size="x-small"
                      class="slds-m-right_x-small"
                    ></lightning-icon>
                    {builderValidationMessage}
                  </div>
                </template>
              </div>
            </section>

            <section class="workspace-card workspace-card--shade">
              <div class="workspace-card__header">
                <div>
                  <p class="section-label">Available Builder Types</p>
                  <h3 class="slds-text-heading_small">
                    Per-catalog override choices
                  </h3>
                </div>
              </div>

              <template if:true={builderOptions}>
                <template for:each={builderOptions} for:item="option">
                  <div key={option.value} class="builder-option-row">
                    <p class="builder-option-row__label">{option.label}</p>
                    <p class="builder-option-row__description">
                      {option.description}
                    </p>
                  </div>
                </template>
              </template>
            </section>
          </div>
        </template>
      </section>
    </div>
  </div>
</template>
